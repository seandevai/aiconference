name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Build app
        run: npm run build --workspace=apps/web
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          SUPABASE_SERVICE_ROLE_KEY: dummy
          GUEST_SESSION_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          NEXT_PUBLIC_LIVEKIT_URL: ws://127.0.0.1:7880
          LIVEKIT_API_KEY: devkey
          LIVEKIT_API_SECRET: dummy

      - name: Nessun segreto nel bundle client
        run: |
          if grep -rEl "SERVICE_ROLE|GUEST_SESSION_SECRET|sk-ant|LIVEKIT_API_SECRET" apps/web/.next/static/; then
            echo "::error::Segreto trovato nel bundle client"
            exit 1
          fi
          echo "pulito"

  db:
    name: RLS e integrazione su Supabase locale
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - uses: supabase/setup-cli@v3
        with:
          version: 2.117.0

      - name: Start Supabase
        run: supabase start

      - name: Export env
        run: |
          eval "$(supabase status -o env)"
          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_APP_URL=http://localhost:3000" >> "$GITHUB_ENV"
          echo "GUEST_SESSION_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: DB tests
        run: npm run test:db

  e2e:
    name: e2e host e ospite, desktop e mobile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - uses: supabase/setup-cli@v3
        with:
          version: 2.117.0

      - name: Start Supabase
        run: supabase start

      - name: Start LiveKit
        run: docker run -d --name livekit --network host livekit/livekit-server:v1.13.7 --dev --bind 0.0.0.0

      # Next legge .env.local dalla root (next.config), quindi lo scriviamo qui.
      - name: Write .env.local
        run: |
          eval "$(supabase status -o env)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "NEXT_PUBLIC_APP_URL=http://localhost:3000"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "GUEST_SESSION_SECRET=$(openssl rand -hex 32)"
            echo "NEXT_PUBLIC_LIVEKIT_URL=ws://localhost:7880"
            echo "LIVEKIT_API_KEY=devkey"
            echo "LIVEKIT_API_SECRET=secret"
          } > .env.local

      - name: E2E
        run: npm run test:e2e

      - name: Report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 3

  secrets-guard:
    name: nessun segreto nel bundle client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Nessuna chiave segreta sotto NEXT_PUBLIC_
        run: |
          if grep -rInE 'NEXT_PUBLIC_[A-Z_]*(SECRET|SERVICE_ROLE|PRIVATE)' \
               --include='*.ts' --include='*.tsx' --include='*.js' \
               --exclude-dir=node_modules . ; then
            echo "::error::Chiave segreta esposta con prefisso NEXT_PUBLIC_"
            exit 1
          fi
          echo "ok"

      - name: Nessun segreto committato in chiaro
        run: |
          if grep -rInE '(sk-ant-api|sk-proj-|sk_live_|whsec_[A-Za-z0-9]{20,})' \
               --include='*.ts' --include='*.tsx' --include='*.js' --include='*.json' \
               --exclude-dir=node_modules --exclude='.env.example' . ; then
            echo "::error::Sembra un segreto reale committato"
            exit 1
          fi
          echo "ok"

  boundaries:
    name: confini fra package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: LiveKit solo in packages/realtime
        run: |
          hits=$(grep -rIl 'livekit-client\|livekit-server-sdk' \
                 --include='*.ts' --include='*.tsx' \
                 --exclude-dir=node_modules apps packages 2>/dev/null \
                 | grep -v '^packages/realtime/' || true)
          if [ -n "$hits" ]; then
            echo "::error::LiveKit importato fuori da packages/realtime:"
            echo "$hits"
            exit 1
          fi
          echo "ok"

      - name: SDK dei provider AI solo in packages/ai
        run: |
          hits=$(grep -rIl '@anthropic-ai/sdk\|from .openai.\|@fal-ai/' \
                 --include='*.ts' --include='*.tsx' \
                 --exclude-dir=node_modules apps packages 2>/dev/null \
                 | grep -v '^packages/ai/' || true)
          if [ -n "$hits" ]; then
            echo "::error::SDK di un provider AI importato fuori da packages/ai:"
            echo "$hits"
            exit 1
          fi
          echo "ok"
